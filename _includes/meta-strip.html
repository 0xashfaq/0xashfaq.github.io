<div class="meta-strip">
  <div class="crumb">
    <span class="red">/</span>
    <span>{{ include.crumb | default: page.title | upcase }}</span>
    <span class="red">·</span>
    <span>{{ include.suffix | default: 'INDEX' | upcase }}</span>
  </div>
  <div class="right">
    <span class="clock" id="clock">— · — · —</span>
    <span>v 4.2 · MMXXVI</span>
  </div>
</div>
