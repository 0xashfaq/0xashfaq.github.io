# ============================================================
#  Blog category metadata
#
#  - The folder name under _blogs/ is the category key.
#  - Adding a new category folder is enough; this file is OPTIONAL.
#    If a folder is missing here, the site auto-derives a label by
#    title-casing the folder name (e.g. "binary-exploitation" →
#    "Binary Exploitation").
#  - Override here when you want a custom label, short tag, or
#    description shown on the blog index, post header, and home page.
#
#  Fields:
#    label       — full display name (used in headings, post header)
#    short       — short pill label (used in post-card chips)
#    description — one-liner shown on the blog index group header
#    accent      — true to render the chip in the red accent style
# ============================================================

web-exploitation:
  label: "Web Exploitation"
  short: "Web"
  description: "CVE disclosures and writeups against modern web targets — XSS, SQLi, SSRF, SSTI, broken auth."
  accent: true

mobile-pentest:
  label: "Mobile Pentest"
  short: "Mobile"
  description: "iOS &amp; Android pentesting tradecraft — Frida hooking, jailbreak/root-detection bypass, SSL pinning, runtime tampering."
  accent: true

