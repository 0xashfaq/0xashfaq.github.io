---
layout: default
---
<section class="page">
  {%- include meta-strip.html crumb=page.title suffix=page.suffix -%}

  <header class="page-header">
    <div class="eyebrow">
      {%- if page.eyebrow -%}{{ page.eyebrow }}{%- else -%}// {{ page.title | upcase }}{%- endif -%}
    </div>
    <h1 class="page-title">{{ page.headline | default: page.title }}</h1>
    {% if page.lede %}
      <p class="page-lede">{{ page.lede }}</p>
    {% endif %}
  </header>

  <div class="page-body prose">
    {{ content }}
  </div>
</section>
